name: Package ForeverQuest

on:
  push:
    branches: [main]
    paths:
      - '*.lua'
      - 'tests/*.lua'
      - 'tools/*.lua'
      - 'DATA_SOURCES.md'
      - '*.toc'
      - 'README.md'
      - '.pkgmeta'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^## Version:/ {print $3; exit}' ForeverQuest.toc)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from ForeverQuest.toc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate bundled Classic + Forever quest catalog
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          # Pin to a reviewed upstream revision. No moving master/beta data.
          SOURCE_REV=a37877c1490027ee48e5722bf602adf34f95a6dc
          for file in \
            data/Forever/foreverQuestDB.lua \
            data/Forever/foreverNpcDB.lua \
            data/Forever/foreverObjectDB.lua \
            data/Forever/foreverItemDB.lua \
            support/Forever/Zones/areaIdToUiMapId.lua \
            LICENSE.md gpl-3.0.md
          do
            mkdir -p ".catalog_source/$(dirname "$file")"
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/Questie/QuestieDB/${SOURCE_REV}/${file}" \
              --output ".catalog_source/${file}"
          done
          lua5.1 tools/build_catalog.lua .catalog_source CatalogData.lua

      - name: Validate standalone Lua syntax and quest routing
        shell: bash
        run: |
          for f in *.lua tests/*.lua tools/*.lua; do luac5.1 -p "$f"; done
          lua5.1 tests/route_spec.lua
          lua5.1 tests/core_smoke.lua
          lua5.1 tests/catalog_smoke.lua
          lua5.1 tests/roadmap_spec.lua
          lua5.1 tests/chains_spec.lua
          lua5.1 tests/navigation_spec.lua

      - name: Check whether this version already exists
        id: exists
        shell: bash
        run: |
          TAG='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p package/ForeverQuest
          cp ForeverQuest.toc *.lua README.md DATA_SOURCES.md package/ForeverQuest/
          mkdir -p package/ForeverQuest/ThirdPartyLicenses
          cp .catalog_source/LICENSE.md package/ForeverQuest/ThirdPartyLicenses/QuestieDB-LICENSE.md
          cp .catalog_source/gpl-3.0.md package/ForeverQuest/ThirdPartyLicenses/QuestieDB-GPLv3.md
          cd package
          zip -r "../ForeverQuest-v${VERSION}.zip" ForeverQuest

      - name: Verify one-addon archive is self-contained
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          ZIP="ForeverQuest-v${VERSION}.zip"
          unzip -t "$ZIP" > /dev/null
          for required in ForeverQuest/ForeverQuest.toc \
            ForeverQuest/CatalogData.lua \
            ForeverQuest/CatalogRuntime.lua \
            ForeverQuest/QuestPlanner.lua \
            ForeverQuest/Route.lua \
            ForeverQuest/Travel.lua \
            ForeverQuest/Knowledge.lua \
            ForeverQuest/Chains.lua \
            ForeverQuest/Strategy.lua \
            ForeverQuest/QuestItems.lua \
            ForeverQuest/ThirdPartyLicenses/QuestieDB-LICENSE.md
          do
            unzip -Z1 "$ZIP" | grep -Fxq "$required"
          done
          if unzip -Z1 "$ZIP" | grep -q '^QuestieDB/'; then
            echo "Unexpected separate addon folder in archive"
            exit 1
          fi
          test "$(stat -c%s "$ZIP")" -gt 100000
          sha256sum "$ZIP"

      - name: Create GitHub release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "ForeverQuest-v${VERSION}.zip" \
            --title "ForeverQuest v${VERSION}" \
            --notes "Automated installable release for WoW: Forever."

      - name: Already released
        if: steps.exists.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already has a release tag; nothing to do."
