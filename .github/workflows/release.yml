name: Package ForeverQuest

on:
  push:
    branches: [main]
    paths:
      - '*.lua'
      - '*.toc'
      - 'README.md'
      - '.pkgmeta'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read addon version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^## Version:/ {print $3; exit}' ForeverQuest.toc)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from ForeverQuest.toc"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Lua syntax and route logic
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          for f in *.lua tests/*.lua; do luac5.1 -p "$f"; done
          lua5.1 tests/route_spec.lua

      - name: Check whether this version already exists
        id: exists
        shell: bash
        run: |
          TAG='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installable ZIP
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p package/ForeverQuest
          cp ForeverQuest.toc *.lua README.md package/ForeverQuest/
          cd package
          zip -r "../ForeverQuest-v${VERSION}.zip" ForeverQuest

      - name: Create GitHub release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TAG='${{ steps.version.outputs.tag }}'
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" "ForeverQuest-v${VERSION}.zip" \
            --title "ForeverQuest v${VERSION}" \
            --notes "Automated installable release for WoW: Forever."

      - name: Already released
        if: steps.exists.outputs.exists == 'true'
        run: echo "Version ${{ steps.version.outputs.version }} already has a release tag; nothing to do."
